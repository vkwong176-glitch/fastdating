  <script>
    (function () {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var unlocked = false;
      function onFirstPointer() {
        if (unlocked) return;
        try {
          var ctx = window.__fdMsgAudioCtx;
          if (!ctx) {
            ctx = new AC();
            window.__fdMsgAudioCtx = ctx;
          }
          if (ctx.state === 'suspended' && ctx.resume) {
            ctx.resume();
          }
        } catch (e) {}
        unlocked = true;
        document.removeEventListener('pointerdown', onFirstPointer, true);
        document.removeEventListener('click', onFirstPointer, true);
        document.removeEventListener('touchend', onFirstPointer, true);
      }
      document.addEventListener('pointerdown', onFirstPointer, true);
      document.addEventListener('click', onFirstPointer, true);
      document.addEventListener('touchend', onFirstPointer, true);
    })();
  </script>
