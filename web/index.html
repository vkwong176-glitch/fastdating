  <!-- 解除舊版 Service Worker，否則瀏覽器可能持續執行舊 main.dart.js（版面與管理員登入不會更新） -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
    (function () {
      function hideHtmlSplash() {
        var el = document.getElementById('fd-html-splash');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      window.addEventListener('flutter-first-frame', hideHtmlSplash);
      setTimeout(hideHtmlSplash, 20000);
    })();
  </script>
