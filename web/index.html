  <!--
    首屏：淺底 + 純 HTML 文字立即顯示（不需等圖／Canvas），改善 PageSpeed Speed Index；
    全黑畫面會讓 SI 長時間停留在「幾乎無可見內容」。
  -->
  <style>
    #fd-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }
    #fd-splash.fd-hidden {
      display: none;
    }
    #fd-splash .fd-splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      max-width: 100%;
    }
    #fd-splash .fd-splash-title {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      font-weight: 700;
      color: #212121;
      letter-spacing: 0.02em;
    }
    #fd-splash .fd-splash-sub {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      font-size: 0.9rem;
      color: #616161;
    }
    #fd-splash .fd-splash-img {
      width: min(72vw, 280px);
      height: auto;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div id="fd-splash" role="status" aria-live="polite" aria-label="載入中">
    <div class="fd-splash-inner">
      <img class="fd-splash-img" src="icons/fd-icon-192.png" width="280" height="280" alt="" fetchpriority="high" decoding="async">
      <p class="fd-splash-title">Fast Dating</p>
      <p class="fd-splash-sub">載入中…</p>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('fd-splash');
      if (el) el.classList.add('fd-hidden');
    });
  </script>
  <!-- 解除舊版 Service Worker，否則瀏覽器可能持續執行舊 main.dart.js（版面與管理員登入不會更新） -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
